[package]

name = "core-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
base64 = "0.22.1"
blake3 = "1.8.5"
futures = "0.3.32"
irc-proto = "1.1.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
tracing = "0.1.44"

tsify = { version = "0.5.6", optional = true, features = ["js"] }
wasm-bindgen = { version = "0.2.126", optional = true }
web-time = { version = "1.1.0", optional = true }
gloo-console = { version = "0.4.0", optional = true }
gloo-net = { version = "0.7.0", optional = true }
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "sync"], optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
rand = { version = "0.10.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }

[features]
web = ["dep:gloo-net", "dep:wasm-bindgen", "dep:gloo-console", "dep:tsify", "dep:web-time", "dep:gloo-timers"]
default = ["dep:tokio"]

[dev-dependencies]
assert_matches = "1.5.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "sync"] }
