name: Setup pnpm
description: Node 24, pnpm from the packageManager field, cached store, frozen install

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # pnpm version comes from the "packageManager" field in package.json
    - run: corepack enable
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
