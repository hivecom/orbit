name: Desktop

on:
  push:
    branches:
      - main
      - prototype
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same native gate CI runs. A core failure here stops every platform build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          targets: ""
          wasm-pack: "false"

      - name: Cargo check
        working-directory: packages/core
        run: cargo check --workspace

      - name: Cargo test
        working-directory: packages/core
        run: cargo test -p core-shared

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm version comes from the "packageManager" field in package.json
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            packages/core
            apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # The desktop front end bundles core-wasm through packages/app.
      - run: pnpm exec vp run --filter core-wasm build

      # Bundles upload to the run as <platform>-<arch>-<bundle> artifacts. A tag
      # push also gets a draft release with the same bundles attached.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          uploadWorkflowArtifacts: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Orbit {0}', github.ref_name) || '' }}
          releaseDraft: true
