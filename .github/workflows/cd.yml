name: CD

# Releases are driven by the app version, not by pushes. Bump the version in
# tauri.conf.json and the next trunk push cuts desktop binaries: a pre-release
# from prototype, a draft release from main. Pushes that don't touch the
# version just run the gate. The web app is production only and deploys on
# every main push. A manual dispatch builds everything and publishes nothing.
on:
  push:
    branches:
      - main
      - prototype
  workflow_dispatch:

# Trunk runs queue rather than cancel: a cancelled matrix would leave a
# published pre-release missing platforms. Manual dry runs can be cancelled.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # github.event.before is the previous trunk commit, which a shallow
          # clone doesn't have. The repo is under 1 MB, so take the lot.
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          CONF: apps/desktop/src-tauri/tauri.conf.json
        run: |
          current=$(jq -r .version "$CONF")
          echo "Version at this commit: $current"

          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "Not a push, so nothing is released."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! previous=$(git show "$BEFORE:$CONF" 2>/dev/null | jq -r .version); then
            echo "No $CONF at $BEFORE, so treating the version as unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version at the previous commit: $previous"
          if [ -z "$previous" ] || [ "$previous" = null ] || [ -z "$current" ] || [ "$current" = null ]; then
            echo "Couldn't read a version on both sides, so no release from this push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$current" = "$previous" ]; then
            echo "Unchanged, so no release from this push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bumped, so this push cuts a release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Production only. The gate already builds the web app on every push.
  web:
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-rust

      - name: Build core-wasm
        working-directory: packages/core/core-wasm
        run: wasm-pack build . --target web

      - run: pnpm --filter web build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  desktop:
    if: needs.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            packages/core
            apps/desktop/src-tauri

      # The desktop front end bundles core-wasm through packages/app. Same
      # command as core-wasm's build script, without `vp run` in front: its
      # task cache injects a preload library into child processes, and dyld
      # aborts when that library and the child differ in architecture.
      - name: Build core-wasm
        working-directory: packages/core/core-wasm
        run: wasm-pack build . --target web

      # Bundles upload to the run as <platform>-<arch>-<bundle> artifacts.
      # A version bump also attaches them to a release: prototype gets a
      # pre-release tagged v<version>-rc.<run>, main a draft v<version>.
      # A dispatch leaves tagName empty, which skips release creation.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          uploadWorkflowArtifacts: true
          tagName: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'v__VERSION__' || format('v__VERSION__-rc.{0}', github.run_number)) || '' }}
          releaseName: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'Orbit v__VERSION__' || format('Orbit v__VERSION__-rc.{0}', github.run_number)) || '' }}
          releaseDraft: ${{ github.ref_name == 'main' }}
          prerelease: ${{ github.ref_name != 'main' }}
