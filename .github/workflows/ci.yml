name: CI

on:
  push:
    branches:
      - main
      - prototype
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm version comes from the "packageManager" field in package.json
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: ./.github/actions/setup-rust

      # Native target. The wasm build below never compiles the tests or the
      # not(feature = "web") branches, so this is the only place they get checked.
      - name: Cargo check
        working-directory: packages/core
        run: cargo check --workspace

      - name: Cargo test
        working-directory: packages/core
        run: cargo test -p core-shared

      - run: pnpm install --frozen-lockfile

      # The `ready` gate, split into steps for clearer failure attribution.
      - name: Check (format, lint, types)
        run: pnpm exec vp run check

      - name: Test
        run: pnpm exec vp run -r test

      - name: Build
        run: pnpm exec vp run -r build
