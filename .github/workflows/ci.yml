name: CI

# The merge gate. Runs on its own for PRs and as the first job of CD, so a
# failure here blocks both the web deploy and the desktop builds.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# github.workflow is the caller's name when CD runs this, so a manual CI
# dispatch on the same ref never cancels a CD run's gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-rust

      # Native target, selected with -p so core-wasm's `web` feature isn't
      # unified in. The wasm build below never compiles the tests or the
      # not(feature = "web") branches, so these two steps are their only check.
      - name: Cargo check
        working-directory: packages/core
        run: cargo check -p core-shared --locked

      - name: Cargo test
        working-directory: packages/core
        run: cargo test -p core-shared --locked

      # The `ready` gate, split into steps for clearer failure attribution.
      - name: Check (format, lint, types)
        run: pnpm exec vp run check

      - name: Test
        run: pnpm exec vp run -r test

      - name: Build
        run: pnpm exec vp run -r build
